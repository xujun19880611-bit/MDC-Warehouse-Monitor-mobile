name: Multi-Repository Data Sync

on:
  push:
    branches:
      - main
    paths:
      - 'SGF.csv'

jobs:
  distribute-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Core Data Repo
        uses: actions/checkout@v4

      - name: Sync to Storage Optimizer Repo
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.MDC_SYNC_TOKEN }}
        with:
          source_file: 'SGF.csv'
          destination_repo: 'xujun19880611-bit/MDC-Warehouse-Monitor'
          destination_folder: ''
          user_email: 'mdc-agent@github.com'
          user_name: 'MDC Core Sync Agent'
          commit_message: 'Automated inventory sync from core data repo'

      - name: Sync to Streamlit Dashboard Repo
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.MDC_SYNC_TOKEN }}
        with:
          source_file: 'SGF.csv'
          destination_repo: 'xujun19880611-bit/MDC-Warehouse-Monitor-POR'
          destination_folder: ''
          user_email: 'mdc-agent@github.com'
          user_name: 'MDC Core Sync Agent'
          commit_message: 'Automated inventory sync from core data repo'

      - name: Sync to Mobile Query Repo
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.MDC_SYNC_TOKEN }}
        with:
          source_file: 'SGF.csv'
          destination_repo: 'xujun19880611-bit/MDC-Warehouse-Monitor-mobile-inventory'
          destination_folder: ''
          user_email: 'mdc-agent@github.com'
          user_name: 'MDC Core Sync Agent'
          commit_message: 'Automated inventory sync from core data repo'
